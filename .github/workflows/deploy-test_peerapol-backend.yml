name: Build and deploy Node.js app to Azure Web App - peerapol-backend

on:
  push:
    branches:
      - deploy-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Build backend (optional)
        run: |
          cd backend
          npm run build --if-present

      - name: Test backend (optional)
        run: |
          cd backend
          npm run test --if-present

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend   # 🔥 สำคัญมาก

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8966B77F6BEC49AD9A12F98481BAAE67 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_26428EB214034CABA6A4197FE29F4244 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3E8001489EFB40DFABF975ABE573BD59 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'peerapol-backend'
          slot-name: 'Production'
          package: .   # ตอนนี้ . = backend แล้ว
